name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile Python
        run: python -m compileall -q actions canbusd scripts tests tools ui vehicles bindings

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check JavaScript syntax
        run: |
          find ui/web_dashboard/static -maxdepth 1 -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Verify maintained vehicle-profile conformance
        run: open-mmi-config vehicle-setup conform --root .

      - name: Verify formal vehicle qualification records
        run: open-mmi-config vehicle-setup qualification report --root .

      - name: Verify maintained vehicle-profile scaffold planning
        run: |
          open-mmi-config vehicle-setup scaffold \
            --root . \
            --brand "Example Brand" \
            --model "Example Model" \
            --generation "Generation" \
            --platform "Platform" \
            --year-from 2000 \
            --year-to 2005 \
            --dry-run

      - name: Verify vehicle capture research tooling
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '(1.000000) can0 123#00\n' > "$work/before.log"
          printf '(2.000000) can0 123#01\n' > "$work/after.log"
          open-mmi-config vehicle-setup capture compare \
            "$work/before.log" "$work/after.log" \
            --output "$work/comparison.json" \
            --root .
          open-mmi-config vehicle-setup capture export \
            "$work/before.log" "$work/after.log" \
            --profile-id example-profile \
            --fixture-bus comfort \
            --output "$work/candidate.json" \
            --root .
          python - "$work/comparison.json" "$work/candidate.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          comparison = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidate = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if comparison["summary"]["changed_ids"] != 1:
              raise SystemExit("capture comparison did not report the changed ID")
          if not candidate.get("experimental") or not candidate.get("review_required"):
              raise SystemExit("candidate fixture is not marked for manual review")
          PY

      - name: Replay maintained vehicle mappings
        run: open-mmi-config vehicle-setup replay --root . seat-leon-1p-pq35

      - name: Verify generated vehicle-action documentation
        run: python tools/generate_vehicle_action_docs.py --check

      - name: Verify generated vehicle-event documentation
        run: python tools/generate_vehicle_event_docs.py --check

      - name: Verify generated vehicle-status documentation
        run: python tools/generate_vehicle_status_docs.py --check

      - name: Verify generated vehicle catalogue documentation
        run: python tools/generate_vehicle_catalogue_docs.py --check

      - name: Verify Open MMI trust boundary
        run: |
          python tools/verify_trust_manifest.py
          python tools/vendor_bootstrap.py --check
          python -m unittest tests.test_trust_invariants tests.test_telemetry_guard tests.test_trust_inspector tests.test_accepted_trust_state tests.test_trust_transition_gate tests.test_trust_lineage tests.test_release_integrity

      - name: Verify CSS module cascade
        run: python tools/verify_css_split.py

      - name: Run frontend module tests
        run: node --test tests/js/*.test.js

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ignored = {".git", "build", "dist", ".venv", "venv"}
          files = [
              path for path in Path(".").rglob("*.json")
              if not ignored.intersection(path.parts)
          ]
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          print(f"Validated {len(files)} JSON files")
          PY

      - name: Validate shell scripts
        run: |
          bash -n scripts/dev_run.sh
          bash -n scripts/manage.sh
          bash -n scripts/open-mmi-desktop

  package:
    name: Build and inspect wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel contents
        run: python tools/verify_wheel.py dist/*.whl

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          from pathlib import Path
          import json
          import bindings
          import canbusd
          import open_mmi_telemetry
          import open_mmi_trust
          from open_mmi_trust import accepted_state as owner_trust_state
          from open_mmi_trust import inspector as trust_inspector
          from open_mmi_trust import release_integrity as trust_release_integrity
          from open_mmi_trust import transition_gate as trust_transition_gate
          import ui.web_dashboard
          from canbusd import event_registry as vehicle_events
          from canbusd import profile_catalogue, profile_replay
          from canbusd import status_registry as vehicle_statuses
          from ui import (
              vehicle_capture_analysis,
              vehicle_profile_conformance,
              vehicle_profile_qualification,
              vehicle_profile_scaffold,
          )
          from ui.web_dashboard import bluetooth, jellyfin, radio, usb
          import vehicles

          roots = {
              "bindings": Path(bindings.__file__).parent / "default.json",
              "telemetry_guard": Path(open_mmi_telemetry.__file__),
              "accepted_owner_trust": Path(owner_trust_state.__file__),
              "trust_inspector": Path(trust_inspector.__file__),
              "trust_release_integrity": Path(trust_release_integrity.__file__),
              "trust_transition_gate": Path(trust_transition_gate.__file__),
              "vehicle_events": vehicle_events.DEFAULT_REGISTRY_PATH,
              "vehicle_statuses": vehicle_statuses.DEFAULT_REGISTRY_PATH,
              "bluetooth": Path(bluetooth.__file__),
              "vehicle_catalogue": Path(vehicles.__file__).parent / "catalogue.v1.json",
              "vehicle_capture_analysis": Path(vehicle_capture_analysis.__file__),
              "vehicle_profile_scaffold": Path(vehicle_profile_scaffold.__file__),
              "vehicle_profile_qualification": Path(vehicle_profile_qualification.__file__),
              "vehicle_qualification_schema": Path(canbusd.__file__).parent / "data" / "vehicle-qualification.v1.schema.json",
              "vehicle_template": Path(vehicles.__file__).parent / "_template" / "config.template.json",
              "vehicle": Path(vehicles.__file__).parent / "seat" / "leon" / "1p-pq35" / "config.json",
              "vehicle_fixtures": Path(vehicles.__file__).parent / "seat" / "leon" / "1p-pq35" / "fixtures" / "mappings.v1.json",
              "vehicle_qualification": Path(vehicles.__file__).parent / "seat" / "leon" / "1p-pq35" / "evidence" / "qualification.v1.json",
              "dashboard": Path(ui.web_dashboard.__file__).parent / "static" / "index.html",
              "frontend_api": Path(ui.web_dashboard.__file__).parent / "static" / "api.js",
              "frontend_preferences": Path(ui.web_dashboard.__file__).parent / "static" / "preferences.js",
              "frontend_clock": Path(ui.web_dashboard.__file__).parent / "static" / "clock.js",
              "frontend_system_settings": Path(ui.web_dashboard.__file__).parent / "static" / "system-settings.js",
              "frontend_status": Path(ui.web_dashboard.__file__).parent / "static" / "status.js",
              "frontend_vehicle": Path(ui.web_dashboard.__file__).parent / "static" / "vehicle.js",
              "frontend_media": Path(ui.web_dashboard.__file__).parent / "static" / "media.js",
              "frontend_jellyfin": Path(ui.web_dashboard.__file__).parent / "static" / "media-jellyfin.js",
              "frontend_radio": Path(ui.web_dashboard.__file__).parent / "static" / "media-radio.js",
              "frontend_usb": Path(ui.web_dashboard.__file__).parent / "static" / "media-usb.js",
              "frontend_bluetooth": Path(ui.web_dashboard.__file__).parent / "static" / "media-bluetooth.js",
              "styles_core": Path(ui.web_dashboard.__file__).parent / "static" / "styles-core.css",
              "styles_media_layout": Path(ui.web_dashboard.__file__).parent / "static" / "styles-media-layout.css",
              "styles_shell": Path(ui.web_dashboard.__file__).parent / "static" / "styles-shell.css",
              "styles_media_sources": Path(ui.web_dashboard.__file__).parent / "static" / "styles-media-sources.css",
              "styles_diagnostics": Path(ui.web_dashboard.__file__).parent / "static" / "styles-diagnostics.css",
              "styles_media_final": Path(ui.web_dashboard.__file__).parent / "static" / "styles-media-final.css",
              "styles_clock": Path(ui.web_dashboard.__file__).parent / "static" / "styles-clock.css",
              "styles_system_settings": Path(ui.web_dashboard.__file__).parent / "static" / "styles-system-settings.css",
              "jellyfin": Path(jellyfin.__file__),
              "radio": Path(radio.__file__),
              "usb": Path(usb.__file__),
          }
          missing = [f"{name}: {path}" for name, path in roots.items() if not path.is_file()]
          if missing:
              raise SystemExit("Missing installed assets:\n" + "\n".join(missing))
          trust_manifest = open_mmi_trust.load_manifest()
          if trust_manifest["capabilities"]["vehicle.can.transmit"]["policy"] != "prohibited":
              raise SystemExit("Installed trust manifest does not preserve the receive-only CAN boundary")
          trust_report = trust_inspector.inspect_system()
          if trust_report["status"] == "FAIL":
              failures = [
                  check["id"]
                  for check in trust_report["checks"]
                  if check["status"] == "FAIL"
              ]
              raise SystemExit(
                  "Installed Trust Inspector reported FAIL: " + ", ".join(failures)
              )
          registry = vehicle_events.registry_payload()
          if "mute_toggle" not in registry["events"]:
              raise SystemExit("Installed vehicle-event registry is incomplete")
          statuses = vehicle_statuses.registry_payload()
          if "doors.front_right" not in statuses["statuses"]:
              raise SystemExit("Installed vehicle-status registry is incomplete")
          vehicle_document = json.loads(roots["vehicle"].read_text())
          vehicle_statuses.require_profile_statuses(vehicle_document)
          resolved_profile = profile_catalogue.resolve_profile(
              Path(vehicles.__file__).parent.parent,
              "seat_1p",
          )
          if resolved_profile["id"] != "seat-leon-1p-pq35":
              raise SystemExit("Installed profile alias did not resolve canonically")
          replay = profile_replay.replay_files(
              roots["vehicle"], roots["vehicle_fixtures"]
          )
          if not replay["valid"]:
              raise SystemExit(f"Installed profile replay failed: {replay}")
          metadata = vehicle_profile_conformance.validate_metadata(
              vehicle_document, expected_id="seat-leon-1p-pq35"
          )
          if not metadata["valid"]:
              raise SystemExit(f"Installed maintained profile metadata is invalid: {metadata}")
          qualification = vehicle_profile_qualification.qualification_report_for_profile(
              vehicle_document,
              profile_path=roots["vehicle"],
              fixtures={
                  "present": True,
                  "valid": replay["valid"],
                  "coverage": replay["coverage"],
              },
              expected_profile_id="seat-leon-1p-pq35",
          )
          if not qualification["validation"]["valid"]:
              raise SystemExit(f"Installed qualification record is invalid: {qualification}")
          print("Installed package imports and runtime assets verified")
          PY

      - name: Verify installed console entry points
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          from importlib import import_module
          from importlib.metadata import distribution
          from shutil import which

          expected = {
              "open-mmi-canbusd": "canbusd.core:main",
              "open-mmi-config": "ui.config_cli:main",
              "open-mmi-dashboard": "ui.web_dashboard.server:main",
              "open-mmi-launcher": "ui.launcher:main",
              "open-mmi-status": "ui.dashboard.status_cli:main",
              "open-mmi-telemetry": "open_mmi_telemetry.cli:main",
              "open-mmi-trust-inspect": "open_mmi_trust.inspector_cli:main",
              "open-mmi-trust-integrity": "open_mmi_trust.release_integrity_cli:main",
              "open-mmi-trust-lineage": "open_mmi_trust.lineage_cli:main",
              "open-mmi-trust-state": "open_mmi_trust.accepted_state_cli:main",
              "open-mmi-trust-transition": "open_mmi_trust.transition_gate_cli:main",
              "open-mmi-update-coordinator": "ui.update_coordinator:main",
              "open-mmi-update-installer": "ui.update_installer:main",
              "open-mmi-vehicle-config-coordinator": "ui.vehicle_config_coordinator:main",
          }
          installed = {
              entry.name: entry.value
              for entry in distribution("open-mmi").entry_points
              if entry.group == "console_scripts"
          }

          errors = []
          for command, target in expected.items():
              actual = installed.get(command)
              if actual != target:
                  errors.append(
                      f"{command}: expected metadata target {target!r}, got {actual!r}"
                  )
              if which(command) is None:
                  errors.append(f"{command}: installed command wrapper was not found on PATH")

              module_name, attribute_name = target.split(":", 1)
              module = import_module(module_name)
              target_object = getattr(module, attribute_name, None)
              if not callable(target_object):
                  errors.append(f"{target}: target is missing or is not callable")

          if errors:
              raise SystemExit(
                  "Installed console entry-point verification failed:\n"
                  + "\n".join(errors)
              )
          print(f"Verified {len(expected)} installed console entry points")
          PY

  browser:
    name: Playwright browser coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  dashboard-smoke:
    name: Dashboard smoke and live probe
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Start demo dashboard and probe it
        run: |
          python -m ui.web_dashboard.server --demo --demo-scenario traffic --port 8765 >dashboard.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          base = "http://127.0.0.1:8765"
          last_error = None
          for _ in range(50):
              try:
                  with urlopen(base + "/api/health", timeout=1) as response:
                      json.load(response)
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.1)
          else:
              raise SystemExit(f"Dashboard did not become ready: {last_error}")

          for endpoint in ("/", "/styles.css", "/styles-core.css", "/styles-media-layout.css", "/styles-shell.css", "/styles-media-sources.css", "/styles-diagnostics.css", "/styles-media-final.css", "/styles-clock.css", "/styles-system-settings.css", "/api.js", "/preferences.js", "/system-settings.js", "/status.js", "/vehicle.js", "/media.js", "/media-jellyfin.js", "/media-radio.js", "/media-usb.js", "/media-bluetooth.js", "/app.js", "/api/status", "/api/health"):
              with urlopen(base + endpoint, timeout=3) as response:
                  if response.status != 200:
                      raise SystemExit(f"{endpoint} returned {response.status}")
          print("Dashboard routes are healthy")
          PY

          OPEN_MMI_PERF_BASE_URL=http://127.0.0.1:8765 \
          OPEN_MMI_PERF_SAMPLES=100 \
          python -m unittest tests.test_dashboard_performance_contracts.LiveDashboardPerformanceTests
